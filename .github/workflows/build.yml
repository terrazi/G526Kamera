name: G526CameraDrive iOS Build

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build iPhone App (unsigned IPA)
    runs-on: macos-15
    permissions:
      contents: write

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Stamp build info (shown in Settings)
        run: |
          STAMP=$(TZ=Europe/Istanbul date '+%d.%m.%Y %H:%M')
          printf 'enum BuildInfo {\n    static let version = "%s · %s · #%s"\n}\n' "${GITHUB_SHA::7}" "$STAMP" "$GITHUB_RUN_NUMBER" > Sources/BuildInfo.swift
          cat Sources/BuildInfo.swift

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build iPhone application (Release)
        run: |
          set -o pipefail
          xcodebuild \
            -project G526CameraDrive.xcodeproj \
            -scheme G526CameraDrive \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DeviceData \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build.log

      - name: Package unsigned IPA
        run: |
          mkdir -p build/ipa/Payload
          cp -R build/DeviceData/Build/Products/Release-iphoneos/G526CameraDrive.app build/ipa/Payload/
          cd build/ipa
          ditto -c -k --sequesterRsrc --keepParent Payload G526CameraDrive-unsigned.ipa

      - name: Upload iPhone IPA
        uses: actions/upload-artifact@v4
        with:
          name: G526CameraDrive-iPhone-IPA
          path: build/ipa/G526CameraDrive-unsigned.ipa

      # GitHub'a girmeden doğrudan indirilebilen bağlantı: https://github.com/<depo>/releases/download/son-surum/G526CameraDrive-unsigned.ipa
      - name: Publish IPA as downloadable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Her sürüm kendi etiketine yayınlanır: eski sürümlerin ("son-surum", "yeni-surum") IPA'sı ezilmez
          TAG=son-surum
          if [ "$GITHUB_REF_NAME" = "yeni-surum" ]; then TAG=yeni-surum; fi
          if [ "$GITHUB_REF_NAME" = "surum-3" ]; then TAG=surum-3; fi
          if [ "$GITHUB_REF_NAME" = "surum-4" ]; then TAG=surum-4; fi
          gh release delete "$TAG" --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" || true
          gh release create "$TAG" build/ipa/G526CameraDrive-unsigned.ipa \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Son sürüm (${GITHUB_REF_NAME})" \
            --notes "Dal: ${GITHUB_REF_NAME} · Commit: ${GITHUB_SHA::7}. İmzasız IPA; Sideloadly ile yükleyin." \
            --prerelease

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: G526CameraDrive-Build-Log
          path: build.log
          if-no-files-found: ignore

  tests:
    name: Unit tests (simulator)
    timeout-minutes: 40
    runs-on: macos-15
    continue-on-error: true

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Run tests
        run: |
          set -o pipefail
          DEVICE=$(xcrun simctl list devices available | grep -m1 -oE 'iPhone [0-9A-Za-z ]+ \(' | sed 's/ ($//')
          echo "Simulator: $DEVICE"
          xcodebuild \
            -project G526CameraDrive.xcodeproj \
            -scheme G526CameraDrive \
            -destination "platform=iOS Simulator,name=$DEVICE" \
            CODE_SIGNING_ALLOWED=NO \
            test 2>&1 | tee test.log

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: G526CameraDrive-Test-Log
          path: test.log
          if-no-files-found: ignore

  screens:
    name: Screenshots (simulator)
    needs: build
    timeout-minutes: 30
    runs-on: macos-15
    continue-on-error: true
    permissions:
      contents: write

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      # Uygulamanın ekranlarını simülatörde gerçekten çizip PNG yazar (Tests/ScreenshotTests.swift)
      - name: Render screens
        run: |
          set -o pipefail
          DEVICE=$(xcrun simctl list devices available | grep -m1 -oE 'iPhone [0-9A-Za-z ]+ \(' | sed 's/ ($//')
          echo "Simulator: $DEVICE"
          mkdir -p /tmp/g526-ekranlar
          TEST_RUNNER_SCREENSHOT_DIR=/tmp/g526-ekranlar xcodebuild \
            -project G526CameraDrive.xcodeproj \
            -scheme G526CameraDrive \
            -destination "platform=iOS Simulator,name=$DEVICE" \
            -only-testing:G526CameraDriveTests/ScreenshotTests \
            CODE_SIGNING_ALLOWED=NO \
            test 2>&1 | tee screens.log
          ls -l /tmp/g526-ekranlar

      - name: Zip screenshots
        if: always()
        run: |
          cd /tmp && zip -r "$GITHUB_WORKSPACE/ekran-goruntuleri.zip" g526-ekranlar || true

      - name: Attach screenshots to the release
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=son-surum
          if [ "$GITHUB_REF_NAME" = "yeni-surum" ]; then TAG=yeni-surum; fi
          if [ "$GITHUB_REF_NAME" = "surum-3" ]; then TAG=surum-3; fi
          if [ "$GITHUB_REF_NAME" = "surum-4" ]; then TAG=surum-4; fi
          gh release upload "$TAG" "$GITHUB_WORKSPACE/ekran-goruntuleri.zip" --clobber --repo "$GITHUB_REPOSITORY" || true

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: G526CameraDrive-Screenshots
          path: /tmp/g526-ekranlar
          if-no-files-found: ignore

      - name: Upload screenshot log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: G526CameraDrive-Screenshot-Log
          path: screens.log
          if-no-files-found: ignore

  # Gerçek Gemini'ye giden uçtan uca deneme (Tests/LiveGeminiTests.swift). Gerçek API'ye istek attığı için her gönderimde çalışmaz:
  # yalnız elle başlatılınca ya da commit iletisinde [canli] varsa. Anahtar deponun GEMINI_API_KEY gizli değişkeninden gelir; yoksa atlanır.
  live-gemini:
    name: Live Gemini (real API, simulator)
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[canli]')
    timeout-minutes: 30
    runs-on: macos-15
    continue-on-error: true
    env:
      HAS_KEY: ${{ secrets.GEMINI_API_KEY != '' }}

    steps:
      - name: Check secret
        run: |
          if [ "$HAS_KEY" = "true" ]; then
            echo "GEMINI_API_KEY var: gerçek Gemini testi çalışacak"
          else
            echo "::warning::GEMINI_API_KEY gizli değişkeni yok: gerçek Gemini testi atlandı"
          fi

      - name: Get source code
        if: env.HAS_KEY == 'true'
        uses: actions/checkout@v4

      - name: Install XcodeGen
        if: env.HAS_KEY == 'true'
        run: brew install xcodegen

      - name: Generate Xcode project
        if: env.HAS_KEY == 'true'
        run: xcodegen generate

      # Sesli soru denemesi için gerçek konuşma kaydı: macOS'un kendi sesiyle okunmuş İngilizce sorular, uygulamanın kaydı gibi 16 kHz tek kanal 16 bit WAV
      - name: Make speech recordings
        if: env.HAS_KEY == 'true'
        run: |
          mkdir -p /tmp/canli
          say -o /tmp/canli/soru6.aiff "Question six. Which animal barks? A, cat. B, bird. C, horse. D, fish. E, dog." || echo "say başarısız: soru6"
          say -o /tmp/canli/soru7.aiff "Question seven. Who owns the red bicycle? A, Anna's father. B, Anna's teacher. C, Anna's grandfather. D, Anna's friend. E, Anna's uncle." || echo "say başarısız: soru7"
          for n in soru6 soru7; do
            afconvert -f WAVE -d LEI16@16000 -c 1 /tmp/canli/$n.aiff /tmp/canli/$n.wav || echo "afconvert başarısız: $n"
          done
          ls -l /tmp/canli
          for f in /tmp/canli/*.wav; do echo "$f: $(head -c 4 "$f")"; done

      - name: Run live Gemini tests
        if: env.HAS_KEY == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -o pipefail
          DEVICE=$(xcrun simctl list devices available | grep -m1 -oE 'iPhone [0-9A-Za-z ]+ \(' | sed 's/ ($//')
          echo "Simulator: $DEVICE"
          : > /tmp/canli/rapor.txt
          TEST_RUNNER_GEMINI_API_KEY="$GEMINI_API_KEY" \
          TEST_RUNNER_LIVE_ASSETS_DIR=/tmp/canli \
          TEST_RUNNER_LIVE_REPORT_FILE=/tmp/canli/rapor.txt \
          xcodebuild \
            -project G526CameraDrive.xcodeproj \
            -scheme G526CameraDrive \
            -destination "platform=iOS Simulator,name=$DEVICE" \
            -only-testing:G526CameraDriveTests/LiveGeminiTests \
            CODE_SIGNING_ALLOWED=NO \
            test 2>&1 | tee live.log

      - name: Show live report
        if: always() && env.HAS_KEY == 'true'
        run: |
          echo "===== CANLI RAPOR ====="
          cat /tmp/canli/rapor.txt || echo "(rapor dosyası yok)"
          echo "===== CANLI SATIRLAR (günlükten) ====="
          grep "CANLI-GEMINI" live.log || echo "(günlükte satır yok)"

      - name: Upload live report
        if: always() && env.HAS_KEY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: G526CameraDrive-Live-Gemini
          path: |
            /tmp/canli/rapor.txt
            live.log
          if-no-files-found: ignore
