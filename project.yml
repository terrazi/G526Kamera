name: G526CameraDrive

options:
  bundleIdPrefix: com.huseyinozer
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  G526CameraDrive:
    type: application
    platform: iOS

    sources:
      - path: Sources
      - path: Resources

    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: "G526 Kamera"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSMicrophoneUsageDescription: "Sesli komutu (örneğin “Okey”) algılamak ve belgeler hakkındaki sesli sorunuzu kaydetmek için mikrofon gerekir."
        NSSpeechRecognitionUsageDescription: "Sesli komutu anlamak için konuşma tanıma gerekir. Mümkünse cihaz içinde çalışır."
        NSLocalNetworkUsageDescription: "G526 kameraya kameranın kendi Wi-Fi ağı üzerinden bağlanmak için yerel ağ erişimi gerekir."
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: com.huseyinozer.g526
            CFBundleURLSchemes:
              - g526kamera

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.huseyinozer.g526
        ENABLE_BITCODE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

    scheme:
      testTargets:
        - G526CameraDriveTests

  G526CameraDriveUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: G526CameraDrive
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.huseyinozer.g526.uitests

  G526CameraDriveTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: G526CameraDrive
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.huseyinozer.g526.tests

schemes:
  G526CameraDriveUI:
    build:
      targets:
        G526CameraDrive: all
        G526CameraDriveUITests: [test]
    test:
      targets:
        - G526CameraDriveUITests
