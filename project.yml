name: G526CameraDrive

options:
  bundleIdPrefix: com.huseyinozer
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  G526CameraDrive:
    type: application
    platform: iOS

    sources:
      - path: Sources
      - path: Resources

    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: "Sesli Kontrol"
        CFBundleName: "Sesli Kontrol"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSMicrophoneUsageDescription: "Sorunuzu yaka mikrofonundan dinlemek için mikrofon erişimi gerekir."
        NSSpeechRecognitionUsageDescription: "Okuduğunuz soruyu telefonun içinde (çevrimdışı) yazıya çevirmek için konuşma tanıma gerekir."
        UIBackgroundModes:
          - audio
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: com.huseyinozer.g526
            CFBundleURLSchemes:
              - g526kamera

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.huseyinozer.g526
        ENABLE_BITCODE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

    scheme:
      testTargets:
        - G526CameraDriveTests

  G526CameraDriveTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: G526CameraDrive
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.huseyinozer.g526.tests
